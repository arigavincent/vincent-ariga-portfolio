# Zero-setup development profile: an in-memory H2 database in PostgreSQL mode.
# Run with: ./gradlew bootRun --args='--spring.profiles.active=local'
# Data is re-seeded on every start and lost on shutdown.
spring:
  datasource:
    url: jdbc:h2:mem:portfolio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
