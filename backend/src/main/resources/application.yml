spring:
  application:
    name: portfolio-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:vincent-ariga-portfolio}
      access-ttl: ${APP_JWT_ACCESS_TTL:15m}
      refresh-ttl: ${APP_JWT_REFRESH_TTL:7d}
    refresh-cookie:
      secure: ${APP_REFRESH_COOKIE_SECURE:true}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
  contact:
    notify-to: ${APP_CONTACT_NOTIFY_TO:}
    notify-from: ${APP_CONTACT_NOTIFY_FROM:}
  storage:
    local-root: ${APP_STORAGE_LOCAL_ROOT:./uploads}
    max-image-size: 5MB
    max-document-size: 10MB
  rate-limit:
    contact:
      capacity: ${APP_RATE_LIMIT_CONTACT_CAPACITY:5}
      period: ${APP_RATE_LIMIT_CONTACT_PERIOD:10m}
    login:
      capacity: ${APP_RATE_LIMIT_LOGIN_CAPACITY:10}
      period: ${APP_RATE_LIMIT_LOGIN_PERIOD:5m}
