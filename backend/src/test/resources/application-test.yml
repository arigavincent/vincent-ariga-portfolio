# Tests run on in-memory H2 (PostgreSQL mode) by default so they need no Docker.
# CI also runs the suite against a real PostgreSQL by setting the TEST_DATASOURCE_* variables.
spring:
  datasource:
    url: ${TEST_DATASOURCE_URL:jdbc:h2:mem:portfolio-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${TEST_DATASOURCE_USERNAME:sa}
    password: ${TEST_DATASOURCE_PASSWORD:}
  flyway:
    clean-disabled: false

app:
  seed:
    enabled: true
